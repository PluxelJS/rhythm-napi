[tools]
node = "24.22.2"
npm = "12.2.1"
pnpm = "11.28.10"
rust = { version = "1.99.1", profile = "minimal", components = ["clippy", "rustfmt"] }
hk = "2.11.0"
viteplus = "1.4.0"

# pnpm's portable npm package also supports Intel macOS, which has no standalone binary.
[tool_alias]
pnpm = "npm:pnpm"

[env]
_.path = ["node_modules/.bin"]
PNPM_CONFIG_PM_ON_FAIL = "ignore"
