name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  NAPI_DIR: crates/music_stream_napi
  RUST_BACKTRACE: '1'

jobs:
  quality:
    name: Quality and runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Validate development tools
        run: vp run check-tools && hk validate
      - name: Rust formatting
        run: vp run check-rust-format
      - name: Rust tests
        run: vp run check-rust-tests
      - name: Clippy
        run: vp run check-rust-lint
      - name: Rust documentation
        run: vp run check-rust-docs
      - name: Node and N-API tests
        working-directory: ${{ env.NAPI_DIR }}
        run: vp run check-tests

  build-bindings:
    uses: ./.github/workflows/bindings.yml
    with:
      checkout_ref: ${{ github.sha }}

  test-bindings:
    name: Test ${{ matrix.settings.target }} on Node 24 and Node 20 runtime
    needs: build-bindings
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 15
    env:
      MISE_ARCH: ${{ matrix.settings.architecture }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, architecture: x64 }
          - { host: windows-latest, target: x86_64-pc-windows-msvc, architecture: x64 }
          - { host: macos-26-intel, target: x86_64-apple-darwin, architecture: x64 }
          - { host: macos-latest, target: aarch64-apple-darwin, architecture: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
          # Install the tools used to test the prebuilt bindings.
          install_args: node npm pnpm viteplus
          cache_key_prefix: mise-v1-${{ matrix.settings.architecture }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: binding-${{ matrix.settings.target }}
          path: crates/music_stream_napi
      - name: Type contract and binding tests
        working-directory: ${{ env.NAPI_DIR }}
        run: vp run check-bindings
      - name: Development runtime binding compatibility
        working-directory: ${{ env.NAPI_DIR }}
        run: node --test scripts/runtime-smoke.mjs
      - name: Minimum runtime binding compatibility
        working-directory: ${{ env.NAPI_DIR }}
        run: mise exec node@20 -- node --test scripts/runtime-smoke.mjs
