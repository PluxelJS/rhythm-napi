name: Build bindings

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref or SHA to build
        required: true
        type: string
      cache_tools:
        description: Reuse installed tools for CI; release callers disable this cache.
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  NAPI_DIR: crates/music_stream_napi

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: ${{ inputs.cache_tools }}
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Link the Windows Node host import library
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nodeVersion = node -p "process.version"
          $nodeLibDir = Join-Path $env:RUNNER_TEMP 'node-import-library'
          New-Item -ItemType Directory -Force $nodeLibDir | Out-Null
          Invoke-WebRequest "https://nodejs.org/dist/$nodeVersion/win-x64/node.lib" -OutFile (Join-Path $nodeLibDir 'node.lib')
          "RUSTFLAGS=-L native=$nodeLibDir -l node" >> $env:GITHUB_ENV
      - name: Build release binding
        working-directory: ${{ env.NAPI_DIR }}
        shell: bash
        run: vp run compile --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: binding-${{ matrix.target }}
          path: crates/music_stream_napi/rhythm_streamer.*.node
          if-no-files-found: error
